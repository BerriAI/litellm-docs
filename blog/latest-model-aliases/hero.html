<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>

*{box-sizing:border-box}body{margin:0}
#canvas{position:relative;width:1200px;height:630px;overflow:hidden;color:#eceeed;font-family:Geist,sans-serif;background:#111312}
header{position:absolute;left:48px;right:48px;top:40px;display:flex;align-items:center;justify-content:space-between;padding-bottom:24px;border-bottom:1px solid #ffffff2b}
header img{width:144px;height:auto;display:block}.label{font:13px/1.4 'Geist Mono',monospace;letter-spacing:.1em}

footer{position:absolute;left:48px;right:48px;bottom:42px;display:flex;justify-content:space-between;align-items:flex-end;gap:35px;border-top:1px solid #ffffff2b;padding-top:25px}
p{margin:0;font-size:32px;line-height:1.08;letter-spacing:-.045em;font-weight:450}
code{font:20px/1.4 'Geist Mono',monospace;letter-spacing:-.035em}

</head>

<main id="canvas">
<header><img src="../../static/img/brand/litellm-logo-white.png" alt="LiteLLM"><span class="label">MODEL ALIASES</span></header>

</main>
</body>
</html>
