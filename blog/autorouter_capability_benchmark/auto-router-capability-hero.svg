<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">LiteLLM Auto Router: 45% lower cost on 25 SWE-bench Verified tasks</title>
  <desc id="desc">Total cost: Opus 5, $20.27; capability router, $11.15. Both runs solved 23 of 25 SWE-bench Verified tasks. The capability router cost 45% less.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f7f0"/>
      <stop offset="1" stop-color="#e6f1e9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="840" rx="20" fill="url(#background)"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="96" y="105" fill="#44634e" font-size="32" font-weight="600">LiteLLM Auto Router</text>
    <text x="84" y="402" fill="#173f2b" font-size="200" font-weight="750" letter-spacing="-8">45%</text>
    <text x="96" y="508" fill="#173f2b" font-size="88" font-weight="650" letter-spacing="-2">lower cost</text>
    <text x="100" y="604" fill="#5f7966" font-size="31">23/25 tasks solved · SWE-bench Verified</text>
    <line x1="840" y1="620" x2="1480" y2="620" stroke="#b8cbbb" stroke-width="2"/>
    <rect x="905" y="260" width="190" height="360" rx="8" fill="#b5c5b9"/>
    <rect x="1225" y="421.973" width="190" height="198.027" rx="8" fill="#2e8555"/>
    <text x="1000" y="232" text-anchor="middle" fill="#4d6253" font-size="44" font-weight="650">$20.27</text>
    <text x="1320" y="394" text-anchor="middle" fill="#26774d" font-size="44" font-weight="700">$11.15</text>
    <text x="1000" y="674" text-anchor="middle" fill="#44634e" font-size="31" font-weight="550">Opus 5</text>
    <text x="1320" y="674" text-anchor="middle" fill="#44634e" font-size="31" font-weight="550">Capability router</text>
  </g>
</svg>
