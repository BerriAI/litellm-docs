<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" role="img" aria-labelledby="title desc">
<title id="title">Recovering an execution after Render restarts</title><desc id="desc">Temporal schedules advance_session. Render saves a launch phase and starts a detached supervisor in Modal. When Render restarts, Hermes can keep running. Temporal retries the activity, and the replacement Render worker reads the existing sandbox journal instead of launching Hermes again. If execution cannot be confirmed, Moyai reports an interruption.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9296ac" stroke-width="1.6"/></marker></defs>
<rect width="960" height="860" rx="20" fill="#fafaff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#20223b">
<text x="36" y="43" fill="#20223b" font-size="25" font-weight="600" text-anchor="start">A retry reconnects to existing work</text>
<text x="36" y="72" fill="#64677e" font-size="16" font-weight="400" text-anchor="start">Recovery path when the Modal sandbox survives the Render restart.</text>
<rect x="40" y="102" width="240" height="82" rx="12" fill="#fff0e3" stroke="#efbb95" stroke-width="1.5"/>
<text x="160" y="136" fill="#20223b" font-size="20" font-weight="600" text-anchor="middle">Temporal Cloud</text>
<text x="160" y="164" fill="#64677e" font-size="14" font-weight="400" text-anchor="middle">Workflow history</text>
<path d="M160 187 V775" stroke="#d5d7e3" stroke-width="2" stroke-dasharray="5 7"/>
<rect x="360" y="102" width="240" height="82" rx="12" fill="#f0ecff" stroke="#b7a7ef" stroke-width="1.5"/>
<text x="480" y="136" fill="#20223b" font-size="20" font-weight="600" text-anchor="middle">Render worker</text>
<text x="480" y="164" fill="#64677e" font-size="14" font-weight="400" text-anchor="middle">Saved execution phase</text>
<path d="M480 187 V775" stroke="#d5d7e3" stroke-width="2" stroke-dasharray="5 7"/>
<rect x="680" y="102" width="240" height="82" rx="12" fill="#e8f8f2" stroke="#93ccbc" stroke-width="1.5"/>
<text x="800" y="136" fill="#20223b" font-size="20" font-weight="600" text-anchor="middle">Modal sandbox</text>
<text x="800" y="164" fill="#64677e" font-size="14" font-weight="400" text-anchor="middle">Hermes + event journal</text>
<path d="M800 187 V775" stroke="#d5d7e3" stroke-width="2" stroke-dasharray="5 7"/>
<polyline points="160,218 480,218" fill="none" stroke="#9296ac" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="320" y="205" fill="#20223b" font-size="16" font-weight="400" text-anchor="middle">advance_session(run_id)</text>
<rect x="356" y="242" width="248" height="54" rx="8" fill="#fff" stroke="#d7ccef" stroke-width="1.5"/>
<text x="480" y="265" fill="#20223b" font-size="15" font-weight="600" text-anchor="middle">Persist sandbox ID</text>
<text x="480" y="286" fill="#64677e" font-size="14" font-weight="400" text-anchor="middle">and launch phase</text>
<polyline points="480,330 800,330" fill="none" stroke="#9296ac" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="640" y="317" fill="#20223b" font-size="16" font-weight="400" text-anchor="middle">Start detached supervisor</text>
<rect x="684" y="352" width="232" height="93" rx="8" fill="#e8f8f2" stroke="#93ccbc" stroke-width="1.5"/>
<text x="800" y="383" fill="#20223b" font-size="17" font-weight="600" text-anchor="middle">Hermes keeps running</text>
<text x="800" y="411" fill="#64677e" font-size="14" font-weight="400" text-anchor="middle">Lock held; events written</text>
<text x="800" y="431" fill="#64677e" font-size="14" font-weight="400" text-anchor="middle">to the sandbox journal</text>
<rect x="365" y="376" width="230" height="57" rx="8" fill="#fff0ee" stroke="#e4a6a0" stroke-width="1.5"/>
<text x="480" y="411" fill="#a8493d" font-size="19" font-weight="600" text-anchor="middle">Render restarts</text>
<polyline points="160,504 480,504" fill="none" stroke="#9296ac" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="320" y="489" fill="#20223b" font-size="16" font-weight="400" text-anchor="middle">Retry the same activity</text>
<polyline points="480,580 800,580" fill="none" stroke="#9296ac" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="640" y="553" fill="#20223b" font-size="16" font-weight="400" text-anchor="middle">Reconnect to saved sandbox;</text>
<text x="640" y="574" fill="#64677e" font-size="14" font-weight="400" text-anchor="middle">read from the last journal offset</text>
<polyline points="800,656 480,656" fill="none" stroke="#9296ac" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="640" y="641" fill="#20223b" font-size="16" font-weight="400" text-anchor="middle">Events + saved final result</text>
<polyline points="480,730 160,730" fill="none" stroke="#9296ac" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="320" y="715" fill="#20223b" font-size="16" font-weight="400" text-anchor="middle">Return next session status</text>
<rect x="36" y="788" width="888" height="48" rx="8" fill="#f2f3f9" stroke="#dedfec" stroke-width="1.5"/>
<text x="480" y="818" fill="#20223b" font-size="16" font-weight="400" text-anchor="middle">If execution cannot be confirmed, stop for review instead of repeating external writes.</text>
</g></svg>
