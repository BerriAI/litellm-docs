<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="565" viewBox="0 0 1040 565" role="img" aria-labelledby="title desc">
<title id="title">Request time with Python and Rust</title>
<desc id="desc">Three aligned request-time bars use a common scale. The current Python cold-path stages total 48.1 ms. The illustrative partial migration moves the author-confirmed 17.0 ms router and translation portion to Rust at a 20x speedup, for 0.85 ms of Rust work and 31.95 ms total, displayed as 32.0 ms. A third bar, Messages with everything in Rust, uses the author-provided 1.7 ms Rust hot-path total. Cold-profile stages, the modeled partial migration, and the measured hot-path total are identified separately. No breakdown from the Rust cold path is reused for the hot path.</desc>
