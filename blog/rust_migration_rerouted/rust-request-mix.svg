<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1400" viewBox="0 0 1040 1400" role="img" aria-labelledby="title desc">
<title id="title">Requests retain fast-path eligibility or move to Python</title>
<desc id="desc">One input splits at the top into blue fast-path candidates and gray Python requests. Horizontally aligned option rows show endpoint, routing, callbacks and providers. More requests branch away between every pair of rows, including endpoint and routing, and join the left edge of the Python lane. Blue means eligible so far; only the final blue stream reaches Rust. Endpoints, routing strategies and providers each allow one choice. Callbacks allow any combination of supported options; an unsupported callback sends the request to Python. Bedrock and Vertex eligibility applies to Anthropic models. Widths are synthetic, not production telemetry, and have no numeric labels.</desc>
