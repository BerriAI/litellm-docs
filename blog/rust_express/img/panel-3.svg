<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Two kinds of stage</title><desc id="d">Two timelines with Rust and Python lanes. Top, a Python stage: on the Rust lane the request pauses, is converted from Rust to Python objects (hatched), waits while the Python lane runs the stage, is converted back from Python to Rust (hatched), and resumes. Bottom, a Rust stage: the Rust lane runs the stage in place and moves straight on to the next stage, much shorter overall.</desc><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbe1d6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="arrm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><rect width="1200" height="640" fill="#fcfcfb"/><text x="32.0" y="40.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700" >Figure 3. Two kinds of stage</text><text x="32.0" y="63.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >A Python stage means converting the request out of Rust and back. A Rust stage works on the data where it is.</text><text x="32.0" y="106.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700" >Python stage</text><text x="214.0" y="162.0" font-size="12.5" fill="#52514e" text-anchor="end" font-weight="600" >Rust</text><line x1="230" y1="180" x2="1160" y2="180" stroke="#e1e0d9"/><text x="214.0" y="214.0" font-size="12.5" fill="#52514e" text-anchor="end" font-weight="600" >Python</text><line x1="230" y1="232" x2="1160" y2="232" stroke="#e1e0d9"/><rect x="230" y="146" width="70" height="30" rx="4" fill="#eb6834" stroke="#b8481c" stroke-width="1.2"/><text x="265.0" y="166.0" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600" >pause</text><rect x="300" y="146" width="150" height="30" rx="4" fill="url(#hatch)" stroke="#b8481c" stroke-width="1.2"/><text x="375.0" y="166.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Rust → Python</text><rect x="450" y="146" width="180" height="30" rx="4" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="4 3"/><text x="540.0" y="166.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" >waiting</text><rect x="450" y="198" width="180" height="30" rx="4" fill="#2a78d6" stroke="#1c5cab" stroke-width="1.2"/><text x="540.0" y="218.0" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600" >run the stage</text><rect x="630" y="146" width="150" height="30" rx="4" fill="url(#hatch)" stroke="#b8481c" stroke-width="1.2"/><text x="705.0" y="166.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Python → Rust</text><rect x="780" y="146" width="70" height="30" rx="4" fill="#eb6834" stroke="#b8481c" stroke-width="1.2"/><text x="815.0" y="166.0" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600" >resume</text><path d="M850,126 v-8 H850" fill="none"/><path d="M230,240 v8 H850 v-8" fill="none" stroke="#0b0b0b" stroke-width="1.2"/><text x="540.0" y="266.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600" >time spent at one Python stage</text><text x="32.0" y="326.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700" >Rust stage</text><text x="214.0" y="382.0" font-size="12.5" fill="#52514e" text-anchor="end" font-weight="600" >Rust</text><line x1="230" y1="400" x2="1160" y2="400" stroke="#e1e0d9"/><text x="214.0" y="434.0" font-size="12.5" fill="#52514e" text-anchor="end" font-weight="600" >Python</text><line x1="230" y1="452" x2="1160" y2="452" stroke="#e1e0d9"/><rect x="230" y="366" width="180" height="30" rx="4" fill="#eb6834" stroke="#b8481c" stroke-width="1.2"/><text x="320.0" y="386.0" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600" >run the stage</text><line x1="416" y1="381" x2="480" y2="381" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrm)"/><text x="488.0" y="385.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >next stage</text><path d="M230,460 v8 H410 v-8" fill="none" stroke="#0b0b0b" stroke-width="1.2"/><text x="320.0" y="486.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600" >time spent at one Rust stage</text><text x="32.0" y="520.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Python stage: pause the request, convert every field into Python objects, run the stage, convert the result back, resume.</text><text x="32.0" y="542.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Rust stage: run the stage on the request in place, then move on. No conversion, no handoff.</text><rect x="32" y="583" width="22" height="14" rx="3" fill="#eb6834" stroke="#b8481c" stroke-width="1.5"/><text x="62.0" y="594.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Rust work</text><rect x="150.1" y="583" width="22" height="14" rx="3" fill="#2a78d6" stroke="#1c5cab" stroke-width="1.5"/><text x="180.1" y="594.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Python work</text><rect x="282.0" y="583" width="22" height="14" rx="3" fill="url(#hatch)" stroke="#b8481c" stroke-width="1.5"/><text x="312.0" y="594.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Conversion between Rust and Python</text><text x="32.0" y="622.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >Illustrative, not to scale: conversion cost grows with request size. A follow-up post measures it.</text></svg>