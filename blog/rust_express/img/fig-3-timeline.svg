t><text x="32" y="448" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >Release dates from the migration tracker. OCR Rust only and Anthropic Messages opt-in shipped in v1.104.0-rc.1. Logging is opt-in in that release but covers part of logging, so it sits in the station row.</text></svg>