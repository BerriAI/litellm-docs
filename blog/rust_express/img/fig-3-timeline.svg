<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Rust migration timeline</title><desc id="d">Timeline from June 2026 to May 2027 with six rows. Foundation: AWS auth shipped July 30, Azure and Google Cloud auth September 13, HTTP client September 20. OCR: Rust by default September 13, Rust only in v1.104.0-rc.1. Messages, Responses and Chat: a missed September 1 promise, Anthropic Messages opt-in shipped, target December 31. Auth and router: a missed September 15 promise, next after the big three lines with no date yet. Cache, secrets, callbacks and spend: ongoing, one at a time, most performance-critical first. Every other API: target April 30, 2027.</desc><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbe1d6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><rect width="1200" height="470" fill="#fcfcfb"/><text x="32" y="40" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="700" >Figure 3. What shipped, what we missed, and the order from here</text><text x="32" y="62" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Filled markers shipped. Crossed markers are dates from the June post that we missed. Bars are targets.</text><line x1="300.0" y1="92" x2="300.0" y2="412" stroke="#e1e0d9"/><text x="304.0" y="86" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400" >Jun ’26</text><line x1="370.9" y1="92" x2="370.9" y2="412" stroke="#e1e0d9"/><text x="374.8791208791209" y="86" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400" >Jul</text><line 