<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Every request is a round trip</title><desc id="d">Schematic of the LiteLLM proxy request path as a loop. The request leaves Your app along the top, passes through two tall blocks spanning both rows (Auth and Router), then three shared stages (Cache, Secrets, Cloud credentials), splits into four API lanes (OCR, Messages, Responses, Chat), goes through the HTTP client to the model provider, and returns along the bottom through Logging and callbacks and Spend tracking, back through the Router and Auth. Everything is drawn in blue for Python. Stages are numbered 1 to 7 in visit order.</desc><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbe1d6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="arrm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><rect width="1200" height="640" fill="#fcfcfb"/><text x="32.0" y="40.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700" >Figure 1. Every request is a round trip</text><text x="32.0" y="63.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Out along the top through auth, routing and five shared stages, then back along the bottom. All Python.</text><path d="M144.0,220.0 L396.0,220.0" fill="none" stroke="#2a78d6" stroke-width="4" stroke-linejoin="round"/><path d="M396.0,220.0 L850.0,220.0" fill="none" stroke="#2a78d6" stroke-width="4" stroke-linejoin="round"/><path d="M850.0,220.0 L900.0,145.0 L1022.0,145.0" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round"/><path d="M850.0,220.0 L900.0,190.0 L1022.0,190.0" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round"/><path d="M850.0,220.0 L900.0,235.0 L1022.0,235.0" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round"/><path d="M850.0,220.0 L900.0,280.0 L1022.0,280.0" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round"/><path d="M1092.0,212.0 L1104.0,212.0" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round"/><path d="M1104.0,450.0 L396.0,450.0" fill="none" stroke="#2a78d6" stroke-width="4" stroke-linejoin="round"/><path d="M396.0,450.0 L144.0,450.0" fill="none" stroke="#2a78d6" stroke-width="4" stroke-linejoin="round"/><path d="M144,213 l8,7 l-8,7" fill="none" stroke="#52514e" stroke-width="2" stroke-linejoin="round"/><path d="M156,443 l-8,7 l8,7" fill="none" stroke="#52514e" stroke-width="2" stroke-linejoin="round"/><circle cx="850" cy="220" r="5" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/><text x="846.0" y="260.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="400" >split by API</text><text x="846.0" y="275.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="400" >after the stages</text><rect x="904" y="135" width="34" height="20" rx="4" fill="#fcfcfb" stroke="#c3c2b7"/><text x="911.0" y="149.5" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600" >OCR</text><rect x="904" y="180" width="67" height="20" rx="4" fill="#fcfcfb" stroke="#c3c2b7"/><text x="911.0" y="194.5" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600" >Messages</text><rect x="904" y="225" width="73" height="20" rx="4" fill="#fcfcfb" stroke="#c3c2b7"/><text x="911.0" y="239.5" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600" >Responses</text><rect x="904" y="270" width="40" height="20" rx="4" fill="#fcfcfb" stroke="#c3c2b7"/><text x="911.0" y="284.5" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600" >Chat</text><rect x="1022.0" y="125.0" width="70" height="175" rx="6" fill="#fcfcfb"/><rect x="1022.0" y="125.0" width="70" height="175" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="1057.0" y="209.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="650" >HTTP</text><text x="1057.0" y="225.5" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >client</text><line x1="456" y1="220" x2="456" y2="149.0" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/><line x1="484" y1="149.0" x2="484" y2="220" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/><rect x="406.0" y="99.0" width="128" height="50" rx="6" fill="#fcfcfb"/><rect x="406.0" y="99.0" width="128" height="50" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="470.0" y="121.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="650" >Cache</text><text x="470.0" y="137.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >seen this before?</text><line x1="598" y1="220" x2="598" y2="149.0" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/><line x1="626" y1="149.0" x2="626" y2="220" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/><rect x="548.0" y="99.0" width="128" height="50" rx="6" fill="#fcfcfb"/><rect x="548.0" y="99.0" width="128" height="50" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="612.0" y="121.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="650" >Secrets</text><text x="612.0" y="137.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >secret managers</text><line x1="740" y1="220" x2="740" y2="149.0" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/><line x1="768" y1="149.0" x2="768" y2="220" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/><rect x="690.0" y="99.0" width="128" height="50" rx="6" fill="#fcfcfb"/><rect x="690.0" y="99.0" width="128" height="50" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="754.0" y="121.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="650" >Cloud credentials</text><text x="754.0" y="137.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >AWS, Azure, GCP</text><line x1="706" y1="450" x2="706" y2="379.0" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/><line x1="734" y1="379.0" x2="734" y2="450" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/><rect x="656.0" y="329.0" width="128" height="50" rx="6" fill="#fcfcfb"/><rect x="656.0" y="329.0" width="128" height="50" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="720.0" y="351.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="650" >Logging</text><text x="720.0" y="367.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >and callbacks</text><line x1="526" y1="450" x2="526" y2="379.0" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/><line x1="554" y1="379.0" x2="554" y2="450" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/><rect x="476.0" y="329.0" width="128" height="50" rx="6" fill="#fcfcfb"/><rect x="476.0" y="329.0" width="128" height="50" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="540.0" y="351.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="650" >Spend tracking</text><text x="540.0" y="367.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >cost per request</text><rect x="172" y="180" width="96" height="310" rx="8" fill="#fcfcfb"/><rect x="172" y="180" width="96" height="310" rx="8" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><line x1="172" y1="220" x2="268" y2="220" stroke="#2a78d6" stroke-width="4" opacity=".55"/><line x1="172" y1="450" x2="268" y2="450" stroke="#2a78d6" stroke-width="4" opacity=".55"/><text x="220.0" y="325.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" >Auth</text><text x="220.0" y="343.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >keys, budgets,</text><text x="220.0" y="357.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >rate limits</text><rect x="300" y="180" width="96" height="310" rx="8" fill="#fcfcfb"/><rect x="300" y="180" width="96" height="310" rx="8" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><line x1="300" y1="220" x2="396" y2="220" stroke="#2a78d6" stroke-width="4" opacity=".55"/><line x1="300" y1="450" x2="396" y2="450" stroke="#2a78d6" stroke-width="4" opacity=".55"/><text x="348.0" y="325.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" >Router</text><text x="348.0" y="343.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >picks the</text><text x="348.0" y="357.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >deployment</text><rect x="32" y="180" width="96" height="310" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="80.0" y="333.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="650" >Your</text><text x="80.0" y="349.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="650" >app</text><path d="M128.0,220.0 L144.0,220.0" fill="none" stroke="#2a78d6" stroke-width="4" stroke-linejoin="round"/><path d="M128.0,450.0 L144.0,450.0" fill="none" stroke="#2a78d6" stroke-width="4" stroke-linejoin="round"/><rect x="1104" y="120" width="64" height="370" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="1136.0" y="303.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="650" >Model</text><text x="1136.0" y="319.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="650" >provider</text><circle cx="174.0" cy="182.0" r="10" fill="#0b0b0b"/><text x="174.0" y="186.0" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700" >1</text><circle cx="302.0" cy="182.0" r="10" fill="#0b0b0b"/><text x="302.0" y="186.0" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700" >2</text><circle cx="408.0" cy="101.0" r="10" fill="#0b0b0b"/><text x="408.0" y="105.0" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700" >3</text><circle cx="550.0" cy="101.0" r="10" fill="#0b0b0b"/><text x="550.0" y="105.0" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700" >4</text><circle cx="692.0" cy="101.0" r="10" fill="#0b0b0b"/><text x="692.0" y="105.0" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700" >5</text><circle cx="658.0" cy="331.0" r="10" fill="#0b0b0b"/><text x="658.0" y="335.0" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700" >6</text><circle cx="478.0" cy="331.0" r="10" fill="#0b0b0b"/><text x="478.0" y="335.0" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700" >7</text><path d="M32.0,590.0 L58.0,590.0" fill="none" stroke="#2a78d6" stroke-width="4" stroke-linejoin="round"/><text x="66.0" y="594.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Python path</text><rect x="167.9" y="583" width="22" height="14" rx="3" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="197.9" y="594.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Python stage</text><text x="32.0" y="622.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >Numbers give the order each request visits the shared stages. Every API takes the same stages; the lanes split only for the provider call.</text></svg>