<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Stages of one proxy request, by implementation</title><desc id="d">Flow diagram. Request row: Client, Auth (Python), Router (Python), Cache (Python, Rust in progress), Secrets (Python, Rust in progress), Cloud auth (Rust), per-API transform (OCR Rust, Messages Rust opt-in, Responses Python, Chat Python), HTTP client (Rust), model provider. Response row back to the client: HTTP client (Rust), response transform, Logging and callbacks (in progress), Spend tracking (in progress), Router (Python), Auth (Python). A bracket marks the per-API transform and HTTP client as the only part the June 2026 benchmark exercised.</desc><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbe1d6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><rect width="1200" height="520" fill="#fcfcfb"/><text x="32" y="40" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="700" >Figure 1. Stages of one proxy request, by implementation, October 2026</text><text x="32" y="62" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Every request runs every stage, whatever API it is for. The stages before and after the per-API work are shared.</text><text x="32" y="102" font-size="11" fill="#898781" text-anchor="start" font-weight="700" letter-spacing="1.2">REQUEST</text><rect x="32" y="120" width="84" height="58" rx="6" fill="#fff" stroke="#c3c2b7" stroke-width="1.5"/><text x="74.0" y="153.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Client</text><line x1="116" y1="149.0" x2="136" y2="149.0" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="138" y="120" width="118" height="58" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="197.0" y="147.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Auth</text><text x="197.0" y="163.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >keys, budgets, limits</text><line x1="256" y1="149.0" x2="276" y2="149.0" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="278" y="120" width="118" height="58" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="337.0" y="147.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Router</text><text x="337.0" y="163.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >picks deployment</text><line x1="396" y1="149.0" x2="416" y2="149.0" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="418" y="120" width="118" height="58" rx="6" fill="#dbe8f8" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 3"/><text x="477.0" y="147.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Cache</text><text x="477.0" y="163.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >lookup</text><line x1="536" y1="149.0" x2="556" y2="149.0" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="558" y="120" width="118" height="58" rx="6" fill="#dbe8f8" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 3"/><text x="617.0" y="147.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Secrets</text><text x="617.0" y="163.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >provider keys</text><line x1="676" y1="149.0" x2="696" y2="149.0" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="698" y="120" width="118" height="58" rx="6" fill="#eb6834" stroke="#b8481c" stroke-width="1.5"/><text x="757.0" y="147.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" >Cloud auth</text><text x="757.0" y="163.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="400" >SigV4, Azure, GCP</text><line x1="816" y1="149.0" x2="836" y2="149.0" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="832" y="86" width="116" height="156" rx="8" fill="none" stroke="#c3c2b7" stroke-dasharray="3 3"/><text x="890.0" y="102" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="600" >Per-API transform</text><rect x="838" y="112" width="104" height="25" rx="6" fill="#eb6834" stroke="#b8481c" stroke-width="1.5"/><text x="890.0" y="129.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="600" >OCR</text><rect x="838" y="142" width="104" height="25" rx="6" fill="url(#hatch)" stroke="#b8481c" stroke-width="1.5"/><text x="890.0" y="159.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Messages*</text><rect x="838" y="172" width="104" height="25" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="890.0" y="189.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Responses</text><rect x="838" y="202" width="104" height="25" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="890.0" y="219.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Chat</text><line x1="948" y1="149.0" x2="962" y2="149.0" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="964" y="120" width="96" height="58" rx="6" fill="#eb6834" stroke="#b8481c" stroke-width="1.5"/><text x="1012.0" y="153.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" >HTTP client</text><line x1="1060" y1="149.0" x2="1080" y2="149.0" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1082" y="120" width="80" height="288" rx="6" fill="#fff" stroke="#c3c2b7" stroke-width="1.5"/><text x="1122" y="262.0" font-size="13" fill