x2="538" y2="379.0" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="418" y="350" width="118" height="58" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="477.0" y="377.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Router</text><text x="477.0" y="393.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >retries, cooldowns</text><line x1="416" y1="379.0" x2="398" y2="379.0" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="278" y="350" width="118" height="58" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="337.0" y="377.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Auth</text><text x="337.0" y="393.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >rate-limit counters</text><line x1="276" y1="379.0" x2="118" y2="379.0" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="32" y="350" width="84" height="58" rx="6" fill="#fff" stroke="#c3c2b7" stroke-width="1.5"/><text x="74" y="383.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Client</text><path d="M832,256 v8 H1060 v-8" fill="none" stroke="#0b0b0b" stroke-width="1.2"/><text x="949.0" y="282" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" >June 2026 benchmark: only this part, in Rust</text><text x="949.0" y="298" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" >(a thin forwarder; no auth, routing, cache, logging or spend)</text><rect x="32" y="457" width="22" height="14" rx="3" fill="#eb6834" stroke="#b8481c" stroke-width="1.5"/><text x="62" y="468" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Rust</text><rect x="116.8" y="457" width="22" height="14" rx="3" fill="url(#hatch)" stroke="#b8481c" stroke-width="1.5"/><text x="146.8" y="468" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Rust, opt-in</text><rect x="259.2" y="457" width="22" height="14" rx="3" fill="#dbe8f8" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 3"/><text x="289.2" y="468" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Python, Rust in progress</text><rect x="488.0" y="457" width="22" height="14" rx="3" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/><text x="518.0" y="468" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Python</text><text x="32" y="496" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >* Messages is Rust only for Anthropic, with LITELLM_RUST=1. Logging has an opt-in Rust path that covers part of logging; it is counted as in progress.</text></svg>