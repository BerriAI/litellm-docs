<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Amdahl's law for a partly migrated proxy</title><desc id="d">Line chart. X axis: share of per-request proxy CPU time that runs in Rust, 0 to 100 percent. Y axis: throughput speedup on a log scale, 1x to 150x. The curve stays below 2x until about half the work is in Rust, reaches 9.4x at 90 percent and 60x at 99 percent, and 150x only at 100 percent. The measured OCR speedups of 1.48x and 1.69x sit at roughly 33 to 41 percent.</desc><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbe1d6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><rect width="1200" height="600" fill="#fcfcfb"/><text x="32" y="40" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="700" >Figure 2. Moving one stage to Rust is capped by the stages that stay in Python</text><text x="32" y="62" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Speedup = 1 / ((1 − p) + p / 150), where p is the share of proxy CPU time per request that runs in Rust. The 150x is the June benchmark ratio.</text><line x1="110" y1="470.0" x2="1150" y2="470.0" stroke="#e1e0d9" stroke-width="1"/><text x="100" y="474.0" font-size="12" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">1x</text><line x1="110" y1="420.2" x2="1150" y2="420.2" stroke="#e1e0d9" stroke-width="1"/><text x="100" y="424.1993319498646" font-size="12" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">2x</text><line x1="110" y1="354.4" x2="1150" y2="354.4" stroke="#e1e0d9" stroke-width="1"/><text x="100" y="358.36642971023116" font-size="12" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">5x</text><line x1="110" y1="304.6" x2="1150" y2="304.6" stroke="#e1e0d9" stroke-width="1"/><text x="100" y="308.56576166009575" font-size="12" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">10x</text><line x1="110" y1="254.8" x2="1150" y2="254.8" stroke="#e1e0d9" stroke-width="1"/><text x="100" y="258.7650936099603" font-size="12" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">20x</text><line x1="110" y1="188.9" x2="1150" y2="188.9" stroke="#e1e0d9" stroke-width="1"/><text x="100" y="192.93219137032685" font-size="12" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">50x</text><line x1="110" y1="139.1" x2="1150" y2="139.1" stroke="#e1e0d9" stroke-width="1"/><text x="100" y="143.13152332019143" font-size="12" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">100x</text><line x1="110" y1="110.0" x2="1150" y2="110.0" stroke="#e1e0d9" stroke-width="1"/><text x="100" y="114.0" font-size="12" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">150x</text><text x="110.0" y="492" font-size="12" fill="#898781" text-anchor="middle" font-weight="400" style="font-variant-numeric: tabular-nums">0%</text><text x="214.0" y="492" font-size="12" fill="#898781" text-anchor="middle" font-weight="400" style="font-variant-numeric: tabular-nums">10%</text><text x="318.0" y="492" font-size="12" fill="#898781" text-anchor="middle" font-weight="400" style="font-variant-numeric: tabular-nums">20%</text><text x="422.0" y="492" font-size="12" fill="#898781" text-anchor="middle" font-weight="400" style="font-variant-numeric: tabular-nums">30%</text><text x="526.0" y="492"