<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Next: finish the lines, then auth and the router</title><desc id="d">The loop schematic with three numbered steps. Step 1: the Messages, Responses and Chat lanes are dashed orange, being built, targeting end of 2026. Step 2: Auth and Router are hatched orange, next, with no date yet. Step 3: the shared stages are a mix: Cloud credentials is Rust, the Cache has a hatched Rust version next with its Python stage still beside it, Logging has a Rust version in progress with its Python stage beside it, and Secrets and Spend tracking are still Python stages off the path.</desc><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbe1d6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="arrm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><rect width="1200" height="640" fill="#fcfcfb"/><text x="32.0" y="40.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700" >Figure 5. Next: finish the lines, then auth and the router</text><text x="32.0" y="63.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >The three big API lanes get Rust first, auth and the router follow, and the shared stages move over one at a time.</text><path d="M144.0,220.0 L396.0,220.0" fill="none" stroke="#eb6834" stroke-width="4" stroke-dasharray="7 5" stroke-linejoin="round" opacity=".8"/><path d="M396.0,220.0 L850.0,220.0" fill="none" stroke="#eb