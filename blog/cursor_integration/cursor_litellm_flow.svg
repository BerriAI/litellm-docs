<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" aria-label="Diagram of Cursor traffic flowing through the LiteLLM gateway">
  <desc>Cursor IDE chat traffic and Cloud Agents API calls both enter the LiteLLM gateway, which forwards chat traffic to LLM providers and agent calls to api.cursor.com</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5c6575"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="250" rx="12" fill="#fafbfd" stroke="#dde3ec"/>
  <rect x="18" y="36" width="148" height="52" rx="8" fill="#f1f4f9" stroke="#dde3ec" stroke-width="1.2"/>
  <text x="92" y="58" text-anchor="middle" fill="#171a21" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">Cursor IDE</text>
  <text x="92" y="76" text-anchor="middle" fill="#5c6575" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Ask · Plan · Agent</text>
  <rect x="18" y="162" width="148" height="52" rx="8" fill="#f1f4f9" stroke="#dde3ec" stroke-width="1.2"/>
  <text x="92" y="184" text-anchor="middle" fill="#171a21" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">Scripts and CI</text>
  <text x="92" y="202" text-anchor="middle" fill="#5c6575" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Cloud Agents API</text>
  <rect x="252" y="62" width="190" height="126" rx="10" fill="#f1f4f9" stroke="#4b54e8" stroke-width="1.2"/>
  <text x="347" y="88" text-anchor="middle" fill="#171a21" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">LiteLLM Gateway</text>
  <text x="347" y="116" text-anchor="middle" fill="#4b54e8" font-family="ui-monospace, Menlo, monospace" font-size="10.5">/cursor/chat/completions</text>
  <text x="347" y="138" text-anchor="middle" fill="#4b54e8" font-family="ui-monospace, Menlo, monospace" font-size="10.5">/cursor/v0/*</text>
  <text x="347" y="170" text-anchor="middle" fill="#5c6575" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">virtual keys · budgets · logs</text>
  <rect x="518" y="36" width="146" height="52" rx="8" fill="#f1f4f9" stroke="#dde3ec" stroke-width="1.2"/>
  <text x="591" y="58" text-anchor="middle" fill="#171a21" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">LLM providers</text>
  <text x="591" y="76" text-anchor="middle" fill="#5c6575" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">OpenAI, Anthropic, Bedrock</text>
  <rect x="518" y="162" width="146" height="52" rx="8" fill="#f1f4f9" stroke="#dde3ec" stroke-width="1.2"/>
  <text x="591" y="184" text-anchor="middle" fill="#171a21" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">api.cursor.com</text>
  <text x="591" y="202" text-anchor="middle" fill="#5c6575" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Cursor Cloud Agents</text>
  <line x1="170" y1="62" x2="247" y2="98" stroke="#5c6575" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="170" y1="188" x2="247" y2="152" stroke="#5c6575" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="446" y1="98" x2="514" y2="62" stroke="#5c6575" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="446" y1="152" x2="514" y2="188" stroke="#5c6575" stroke-width="1.2" marker-end="url(#arr)"/>
</svg>
