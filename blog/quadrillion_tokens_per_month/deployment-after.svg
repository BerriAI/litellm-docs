<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="779" viewBox="0 0 800 779" role="img" aria-labelledby="title desc">
<title id="title">LiteLLM high-throughput deployment</title>
<desc id="desc">A Kubernetes Service sends requests to four workers in the gateway container. The gateway uses Rust token counting and a shared PgBouncer pool for Postgres. Separate metrics and spend collector containers run in the same pod. Prometheus receives metrics, and the workers and collector use Redis shared state. The collector processes spend after responses and shares the PgBouncer pool. An autoscaler adds whole three-container gateway pods based on requests, tokens, CPU and memory.</desc>
