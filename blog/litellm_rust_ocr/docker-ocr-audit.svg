<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Audited Rust OCR proxy results</title>
  <desc id="desc">Across four fresh-container, order-reversed trials, Rust delivers 1.44 times the throughput at 1 MiB and 1.70 times the throughput at 8 MiB. At 8 MiB saturation, retained anonymous memory is 697 MiB for Python and 168 MiB for Rust.</desc>
  <rect width="1200" height="720" fill="#111827"/>
  <style>
    .title { fill: #f9fafb; font: 600 28px Arial, sans-serif; }
    .subtitle { fill: #cbd5e1; font: 18px Arial, sans-serif; }
    .label { fill: #e5e7eb; font: 18px Arial, sans-serif; }
    .value { fill: #f9fafb; font: 600 18px Arial, sans-serif; }
    .axis { fill: #94a3b8; font: 15px Arial, sans-serif; }
    .note { fill: #cbd5e1; font: 16px Arial, sans-serif; }
    .python { fill: #f59e0b; }
    .rust { fill: #22c55e; }
    .grid { stroke: #334155; stroke-width: 1; }
  </style>
  <text x="60" y="58" class="title">Audited OCR proxy results</text>
  <text x="60" y="88" class="subtitle">Median of four fresh-container, order-reversed trials</text>

  <text x="60" y="146" class="title" style="font-size:22px">Throughput</text>
  <rect x="910" y="126" width="16" height="16" class="python"/>
  <text x="934" y="140" class="axis">Python</text>
  <rect x="1012" y="126" width="16" height="16" class="rust"/>
  <text x="1036" y="140" class="axis">Rust</text>
  <line x1="260" y1="170" x2="1120" y2="170" class="grid"/>
  <line x1="260" y1="170" x2="260" y2="370" class="grid"/>
  <line x1="690" y1="170" x2="690" y2="370" class="grid"/>
  <line x1="1120" y1="170" x2="1120" y2="370" class="grid"/>
  <text x="252" y="396" class="axis">0</text>
  <text x="670" y="396" class="axis">110</text>
  <text x="1098" y="396" class="axis">220 RPS</text>
  <text x="60" y="222" class="label">1 MiB, c32</text>
  <rect x="260" y="190" width="582" height="22" class="python"/>
  <rect x="260" y="216" width="844" height="22" class="rust"/>
  <text x="850" y="208" class="value">149</text>
  <text x="1112" y="234" class="value">216</text>
  <text x="60" y="294" class="label">8 MiB, c8</text>
  <rect x="260" y="262" width="86" height="22" class="python"/>
  <rect x="260" y="288" width="148" height="22" class="rust"/>
  <text x="354" y="280" class="value">22</text>
  <text x="416" y="306" class="value">38</text>
  <text x="60" y="352" class="note">Median gain: 1.44x at 1 MiB, 1.70x at 8 MiB</text>

  <text x="60" y="480" class="title" style="font-size:22px">Retained anonymous memory after 8 MiB saturation</text>
  <line x1="260" y1="500" x2="1120" y2="500" class="grid"/>
  <line x1="260" y1="500" x2="260" y2="650" class="grid"/>
  <line x1="690" y1="500" x2="690" y2="650" class="grid"/>
  <line x1="1120" y1="500" x2="1120" y2="650" class="grid"/>
  <text x="252" y="680" class="axis">0</text>
  <text x="667" y="680" class="axis">350</text>
  <text x="1080" y="680" class="axis">700 MiB</text>
  <text x="60" y="546" class="label">Python</text>
  <rect x="260" y="522" width="800" height="24" class="python"/>
  <text x="1068" y="541" class="value">651 → 697 MiB</text>
  <text x="60" y="590" class="label">Rust</text>
  <rect x="260" y="566" width="193" height="24" class="rust"/>
  <text x="461" y="585" class="value">158 → 168 MiB</text>
  <text x="60" y="632" class="note">At 1 MiB, retained memory was similar across both paths.</text>
</svg>
