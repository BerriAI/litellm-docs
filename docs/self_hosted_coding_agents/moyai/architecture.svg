<text x="62" y="251" class="label">Moyai app + worker</text>
<text x="62" y="282" class="small">Auth · chat · queue · execution phase</text>
<rect x="62" y="307" width="464" height="61" rx="10" fill="#fffefa" class="box"/>
<text x="82" y="344" class="label">Broker: model and app access</text>
