<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-labelledby="title desc">
<title id="title">Moyai: orchestration, execution, and access</title>
<desc id="desc">Slack and browser requests enter the Moyai control plane. A worker coordinates an independent Modal agent sandbox. The sandbox uses a run capability to call the app broker for model and connected-app access. LiteLLM holds provider keys. The app stores session state; sandbox snapshots store files and context. Optional Temporal schedules the worker in the Render deployment.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64647a"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#292b4e}.label{font-size:22px;font-weight:700}.small{font-size:18px;fill:#53536d}.eyebrow{font-size:15px;font-weight:700;letter-spacing:1.8px}.wire{fill:none;stroke:#64647a;stroke-width:2;marker-end:url(#arrow)}.box{stroke:#292b4e;stroke-width:2}
  </style>
</defs>
