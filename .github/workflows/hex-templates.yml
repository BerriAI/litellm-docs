name: Hex templates
on:
  pull_request:
    paths:
      - 'static/hex/**'
      - 'scripts/test_hex_templates.py'
      - 'scripts/hex-template-requirements.txt'
      - '.github/workflows/hex-templates.yml'
  push:
    branches: [main]
    paths:
      - 'static/hex/**'
      - 'scripts/test_hex_templates.py'
      - 'scripts/hex-template-requirements.txt'
permissions:
  contents: read
jobs:
  template-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: hex_template_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/hex-template-requirements.txt
      - run: python scripts/test_hex_templates.py
        env:
          HEX_TEST_DSN: postgresql://postgres@localhost:5432/hex_template_test
