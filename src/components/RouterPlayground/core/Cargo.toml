[package]
name = "router-playground"
version = "0.0.1"
edition = "2021"
publish = false
description = "The LiteLLM router core compiled to WebAssembly, with a scripted host and a virtual clock"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Point this at a litellm main checkout (see README).
litellm-router-core = { path = "../../../../../litellm/litellm-rust/crates/router-core" }
litellm-cache = { path = "../../../../../litellm/litellm-rust/crates/cache" }
async-trait = "0.1"
getrandom = { version = "0.2", features = ["js"] }
parking_lot = "0.12"
pollster = "0.3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "=0.2.126"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
