- cellId: 101eab1d-0014-51d1-93e7-b698a10c91ff
  cellLabel: Metric notes
  cellType: MARKDOWN
  config:
    source: '## Read the board

      Cache hit rate measures LiteLLM response-cache hits among requests with a known cache flag. Provider
      prompt caching needs provider cache-token data and a pricing baseline. This template does not calculate
      cache savings.


      TTFT covers requests with a completion-start timestamp. Missing values stay unknown. Review data
      coverage before comparing periods. The cost-change rule flags increases above 25% and $10 across
      two complete 7-day windows with records on each day; treat it as a review queue, not an anomaly
      model.


      ROI = (validated business value - LLM spend - other costs) / (LLM spend + other costs). Leave business
      value blank until Finance validates it. Track department ownership and business outcomes in your
      own governed tables. You must verify logging completeness and currency before using this board for
      financial reporting.

      '
