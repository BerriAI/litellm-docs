- cellId: 4c4a2d1d-9655-5ad6-8b39-b2360056d560
  cellLabel: Calculate board
  cellType: CODE
  config:
    source: "data = spend_daily.copy()\ndata['day'] = pd.to_datetime(data['day']).dt.normalize()\n_numeric\
      \ = [c for c in data.columns if c not in ['day', 'team_id', 'team_name', 'model']]\ndata[_numeric]\
      \ = data[_numeric].apply(pd.to_numeric)\nif team_filter.strip():\n    data = data[data.team_id ==\
      \ team_filter.strip()]\nif team_name_filter.strip():\n    data = data[data.team_name == team_name_filter.strip()]\n\
      period = data[(data.day >= report_start) & (data.day < report_end)].copy()\nrequests = int(period.requests.sum())\n\
      spend = period.spend_usd.sum(min_count=1)\nknown_latency = period.latency_count.sum()\nknown_ttft\
      \ = period.ttft_count.sum()\ncache_known = period.response_cache_known.sum()\nsummary = pd.DataFrame([dict(\n\
      \    spend_usd=spend, requests=requests, tokens=period.tokens.sum(),\n    cost_per_1k_requests=1000*spend/requests\
      \ if requests else np.nan,\n    failure_rate=period.failures.sum()/(requests-period.unknown_status_requests.sum())\n\
      \        if requests > period.unknown_status_requests.sum() else np.nan,\n    response_cache_hit_rate=period.response_cache_hits.sum()/cache_known\
      \ if cache_known else np.nan,\n    average_latency_seconds=period.latency_seconds_sum.sum(min_count=1)/known_latency\
      \ if known_latency else np.nan,\n    average_ttft_seconds=period.ttft_seconds_sum.sum(min_count=1)/known_ttft\
      \ if known_ttft else np.nan,\n    unknown_cost_requests=period.unknown_cost_requests.sum(),\n  \
      \  unknown_status_requests=period.unknown_status_requests.sum(),\n    observed_days=period.day.nunique())])\n\
      team_spend = period.groupby(['team_id', 'team_name'], as_index=False).agg(\n    spend_usd=('spend_usd',\
      \ lambda s: s.sum(min_count=1)), requests=('requests', 'sum'),\n    tokens=('tokens', 'sum'), failures=('failures',\
      \ 'sum'),\n    observed_days=('day', 'nunique'))\nteam_spend['cost_per_1k_requests'] = 1000*team_spend.spend_usd/team_spend.requests.replace(0,\
      \ np.nan)\nteam_spend['spend_share_pct'] = 100*team_spend.spend_usd/spend if pd.notna(spend) and\
      \ spend > 0 else np.nan\nteam_spend = team_spend.sort_values('spend_usd', ascending=False)\nmodel_spend\
      \ = period.groupby(['team_id', 'model'], as_index=False).agg(\n    spend_usd=('spend_usd', lambda\
      \ s: s.sum(min_count=1)), requests=('requests', 'sum'))\n# Gaps stay unknown. A day without rows\
      \ can mean zero traffic or lost logging.\ndaily = period.groupby(['day', 'team_id'], as_index=False).agg(\n\
      \    spend_usd=('spend_usd', lambda s: s.sum(min_count=1)))\n_grid = pd.MultiIndex.from_product([pd.date_range(report_start,\
      \ report_end-pd.Timedelta(days=1)),\n    sorted(period.team_id.unique())], names=['day', 'team_id'])\n\
      daily = daily.set_index(['day','team_id']).reindex(_grid).reset_index()\n\n# Compare equal 7-day\
      \ windows, excluding today. Require records on all 7 days.\n_recent = data[(data.day >= report_end-pd.Timedelta(days=7))\
      \ & (data.day < report_end)]\n_previous = data[(data.day >= report_end-pd.Timedelta(days=14)) &\
      \ (data.day < report_end-pd.Timedelta(days=7))]\ndef window_totals(frame):\n    return frame.groupby('team_id').agg(spend=('spend_usd',\
      \ lambda s: s.sum(min_count=1)),\n        requests=('requests', 'sum'), days=('day', 'nunique'))\n\
      change = window_totals(_recent).join(window_totals(_previous), lsuffix='_recent', rsuffix='_previous',\
      \ how='outer')\nchange['spend_change_pct'] = 100*(change.spend_recent/change.spend_previous.replace(0,np.nan)-1)\n\
      change['unit_cost_change_pct'] = 100*((change.spend_recent/change.requests_recent.replace(0,np.nan))/\n\
      \    (change.spend_previous/change.requests_previous.replace(0,np.nan))-1)\nchange['review'] = np.where((change.days_recent\
      \ == 7) & (change.days_previous == 7),\n    np.where((change.spend_change_pct > 25) & ((change.spend_recent-change.spend_previous)\
      \ >= 10),\n        'Review cost increase', 'Within rule'), 'Insufficient coverage')\nchange = change.reset_index()\n\
      \n# Keep ROI absent until the business-value input covers the selected period.\nroi = period.groupby('team_id',\
      \ as_index=False).agg(\n    spend_usd=('spend_usd', lambda s: s.sum(min_count=1)),\n    unknown_cost_requests=('unknown_cost_requests',\
      \ 'sum'), observed_days=('day','nunique'))\nroi['roi_pct'] = np.nan\nroi['net_value_usd'] = np.nan\n\
      roi['value_status'] = 'Needs validated business value'\nroi.loc[(roi.unknown_cost_requests > 0)\
      \ | (roi.observed_days < (report_end-report_start).days), 'value_status'] = 'Incomplete spend coverage'\n\
      if team_name_filter.strip():\n    roi['value_status'] = 'ROI needs full team scope'\nif not value_data.empty:\n\
      \    if value_data.team_id.duplicated().any():\n        raise ValueError('Provide one business-value\
      \ row per team and report window.')\n    values = value_data.copy()\n    values[['value_usd','other_cost_usd']]\
      \ = values[['value_usd','other_cost_usd']].apply(pd.to_numeric, errors='raise')\n    if (values[['value_usd','other_cost_usd']]\
      \ < 0).any().any():\n        raise ValueError('Business value and other costs must be nonnegative.')\n\
      \    values['coverage_start'] = pd.to_datetime(values.coverage_start)\n    values['coverage_end']\
      \ = pd.to_datetime(values.coverage_end)\n    for index, row in roi.iterrows():\n        match =\
      \ values[(values.team_id == row.team_id) &\n                       (values.coverage_start == report_start)\
      \ & (values.coverage_end == report_end)]\n        if (len(match) == 1 and pd.notna(row.spend_usd)\
      \ and row.unknown_cost_requests == 0\n                and row.observed_days == (report_end-report_start).days\
      \ and not team_name_filter.strip()):\n            value = match.iloc[0]\n            if pd.notna(value.value_usd)\
      \ and pd.notna(value.other_cost_usd):\n                total_cost = row.spend_usd + value.other_cost_usd\n\
      \                roi.loc[index, 'net_value_usd'] = value.value_usd - total_cost\n              \
      \  roi.loc[index, 'roi_pct'] = 100*(value.value_usd-total_cost)/total_cost if total_cost > 0 else\
      \ np.nan\n                roi.loc[index, 'value_status'] = 'Validated input; excludes untracked\
      \ costs'\n"
