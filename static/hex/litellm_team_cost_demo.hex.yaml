- cellId: 9f2ee2c1-c9b7-5e03-853b-51ba6c25f7dc
  cellLabel: Read me
  cellType: MARKDOWN
  config:
    source: '# LiteLLM team cost board

      Template v2.0.0 · Synthetic demo. Filter by team and compare daily spend, unit cost and model mix.
      Use the Postgres template for your data.

      '
- cellId: 3989fc93-d6e3-5907-9e0d-e19b81b48b76
  cellLabel: Settings
  cellType: CODE
  config:
    source: "import pandas as pd\nimport numpy as np\nimport plotly.express as px\nfrom datetime import\
      \ datetime, timezone\n\nTEMPLATE_VERSION = '2.0.0'\npx.defaults.template = 'plotly_white'\npx.defaults.color_discrete_sequence\
      \ = ['#263cdb', '#0f766e', '#b45309', '#64748b']\n# UTC dates: end is exclusive. Leave blank to\
      \ use the last 30 complete days.\nreport_end = pd.Timestamp(datetime.now(timezone.utc).date())\n\
      report_start = report_end - pd.Timedelta(days=30)\n# Add one row per team for this exact report\
      \ window after Finance validates it.\n# value_usd: realized revenue or approved avoided cost; other_cost_usd:\
      \ infra,\n# automation, licenses and labor. Avoid counting the same benefit twice.\nvalue_data =\
      \ pd.DataFrame(columns=['team_id', 'value_usd', 'other_cost_usd',\n                            \
      \       'coverage_start', 'coverage_end'])\n"
- cellId: bcd197b2-1412-5f82-8de6-abe118fb7c81
  cellLabel: Source
  cellType: CODE
  config:
    source: "import pandas as pd\nfrom datetime import datetime, timezone, timedelta\n\n# Template v2.0.0.\
      \ Synthetic data for a reproducible preview.\n_demo_end = datetime.now(timezone.utc).date()\n_demo_rows\
      \ = []\nfor _n in range(60):\n    _day = _demo_end - timedelta(days=60-_n)\n    for _i, _team in\
      \ enumerate(['support-assistant', 'document-review', 'internal-search']):\n        _requests = 900\
      \ + _i * 300 + (_n % 7) * 40\n        _rate = [0.006, 0.012, 0.003][_i]\n        if _team == 'document-review'\
      \ and _n >= 53:\n            _rate *= 1.8\n        _seconds = [2.1, 4.2, 1.3][_i]\n        _demo_rows.append(dict(\n\
      \            day=_day, team_id=['support', 'legal', 'engineering'][_i], team_name=['Support assistant',\
      \ 'Document review', 'Internal search'][_i],\n            model='demo-premium-v2' if _team == 'document-review'\
      \ and _n >= 53 else 'demo-standard',\n            requests=_requests, spend_usd=round(_requests*_rate,\
      \ 4), unknown_cost_requests=0,\n            tokens=_requests*650, failures=_requests//100, unknown_status_requests=0,\n\
      \            response_cache_hits=_requests//10, response_cache_known=_requests,\n            latency_seconds_sum=_requests*_seconds,\
      \ latency_count=_requests,\n            ttft_seconds_sum=_requests*0.7, ttft_count=_requests))\n\
      spend_daily = pd.DataFrame(_demo_rows)\n"
