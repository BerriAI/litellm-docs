<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 350" role="img" aria-label="Worker claims before and now: loading every lens versus paging through batches of 20 due lenses through the due_at index" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<title>Worker claims before and now: loading every lens versus paging through batches of 20 due lenses through the due_at index</title>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#facc15" flood-opacity="0.35"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
<linearGradient id="chg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="1" y="1" width="928" height="348" rx="20" fill="url(#bg)" stroke="#e2e8f0"/>
<text x="40" y="48" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1.2">BEFORE</text>
<text x="40" y="214" font-size="11" fill="#b45309" font-weight="700" letter-spacing="1.2">NOW</text>
<g filter="url(#sh)"><rect x="40" y="66" width="236" height="88" rx="16" fill="#fff" stroke="#e2e8f0"/></g>
<rect x="58" y="88.0" width="44" height="44" rx="12" fill="#f1f5f9"/><g fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="68" y="98.0" width="24" height="24" rx="4"/><path d="M74 106.0l4 4-4 4M81 114.0h6"/></g>
<text x="116" y="105.0" font-size="15.5" fill="#0f172a" font-weight="600">Worker claim</text>
<text x="116" y="126.0" font-size="12.5" fill="#64748b">POST /lens/worker/claim</text>
<rect x="318" y="66" width="262" height="88" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
<rect x="336" y="88.0" width="44" height="44" rx="12" fill="#f1f5f9"/><g fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"><path d="M348 97.0h14l6 6v20h-20z"/><path d="M362 97.0v6h6"/></g>
<text x="394" y="95.0" font-size="15.5" fill="#94a3b8" font-weight="600">Load every lens</text>
<text x="394" y="116.0" font-size="12.5" fill="#64748b">221 documents, 11.5 MB</text>
<text x="394" y="135.0" font-size="12.5" fill="#64748b">then filter in Python</text>
<path d="M278 110H314" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<rect x="612" y="81" width="290" height="58" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="628" y="107" font-size="17" fill="#334155" font-weight="700">2.8 s per claim</text>
<text x="628" y="126" font-size="12" fill="#64748b">grows with every lens stored</text>
<g filter="url(#sh)"><rect x="40" y="232" width="236" height="88" rx="16" fill="#fff" stroke="#e2e8f0"/></g>
<rect x="58" y="254.0" width="44" height="44" rx="12" fill="#f1f5f9"/><g fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="68" y="264.0" width="24" height="24" rx="4"/><path d="M74 272.0l4 4-4 4M81 280.0h6"/></g>
<text x="116" y="271.0" font-size="15.5" fill="#0f172a" font-weight="600">Worker claim</text>
<text x="116" y="292.0" font-size="12.5" fill="#64748b">POST /lens/worker/claim</text>
<g filter="url(#glow)"><rect x="318" y="232" width="262" height="88" rx="16" fill="url(#chg)" stroke="#f59e0b" stroke-width="1.6"/></g>
<rect x="336" y="254.0" width="44" height="44" rx="12" fill="#fff" stroke="#fde68a"/><g fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round"><circle cx="352" cy="276.0" r="6"/><path d="M358 276.0h12M366 276.0v5M370 276.0v4"/></g>
<text x="394" y="261.0" font-size="15.5" fill="#0f172a" font-weight="600">due_at index</text>
<text x="394" y="282.0" font-size="12.5" fill="#92400e">due_at &lt;= now, scope in SQL</text>
<text x="394" y="301.0" font-size="12.5" fill="#92400e">LIMIT 20, one try each</text>
<rect x="502.20000000000005" y="221" width="65.80000000000001" height="22" rx="11" fill="#f59e0b"/>
<text x="535.1" y="236" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" letter-spacing="0.8">INDEXED</text>
<path d="M278 276H314" stroke="#d97706" stroke-width="2.4" fill="none" marker-end="url(#ara)"/>
<rect x="612" y="247" width="290" height="58" rx="12" fill="#fffbeb" stroke="#fde68a"/>
<text x="628" y="273" font-size="17" fill="#b45309" font-weight="700">52 KB, about 20 ms per claim</text>
<text x="628" y="292" font-size="12" fill="#64748b">same at 21 or 221 lenses</text>
</svg>
