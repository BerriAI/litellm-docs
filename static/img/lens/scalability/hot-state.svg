<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 360" role="img" aria-label="Lens state today in one JSONB document versus the target with narrow job rows and append-only findings" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<title>Lens state today in one JSONB document versus the target with narrow job rows and append-only findings</title>
<defs>
