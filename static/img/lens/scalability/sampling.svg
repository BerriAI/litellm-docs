<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 420" role="img" aria-label="Sampling before and now: 52 paged queries that each rank every trace versus one query whose selection is frozen on the job" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<title>Sampling before and now: 52 paged queries that each rank every trace versus one query whose selection is frozen on the job</title>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#facc15" flood-opacity="0.35"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
<linearGradient id="chg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="1" y="1" width="928" height="418" rx="20" fill="url(#bg)" stroke="#e2e8f0"/>
<rect x="24" y="24" width="430" height="372" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="476" y="24" width="430" height="372" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<text x="48" y="56" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1.2">BEFORE: 100 ROWS PER PAGE</text>
<text x="500" y="56" font-size="11" fill="#b45309" font-weight="700" letter-spacing="1.2">NOW: ONE PASS</text>
<g filter="url(#sh)"><rect x="64" y="76" width="350" height="72" rx="16" fill="#fff" stroke="#e2e8f0"/></g>
<rect x="82" y="90.0" width="44" height="44" rx="12" fill="#f1f5f9"/><g fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="92" y="100.0" width="24" height="24" rx="4"/><path d="M98 108.0l4 4-4 4M105 116.0h6"/></g>
<text x="140" y="107.0" font-size="15.5" fill="#0f172a" font-weight="600">Worker</text>
<text x="140" y="128.0" font-size="12.5" fill="#64748b">sample(after=cursor, page_size=100)</text>
<rect x="84" y="196" width="310" height="84" rx="16" fill="#fff" stroke="#e2e8f0"/>
<rect x="74" y="186" width="330" height="84" rx="16" fill="#fff" stroke="#e2e8f0"/>
<g filter="url(#sh)"><rect x="64" y="176" width="330" height="84" rx="16" fill="#fff" stroke="#e2e8f0"/></g>
<rect x="82" y="196.0" width="44" height="44" rx="12" fill="#f1f5f9"/><g transform="translate(92 206.0)"><path fill="#111827" d="M21.333 10H24v4h-2.667ZM16 1.335h2.667v21.33H16Zm-5.333 0h2.666v21.33h-2.666ZM0 22.665V1.335h2.667v21.33zm5.333-21.33H8v21.33H5.333Z"/></g>
<text x="140" y="203.0" font-size="15.5" fill="#0f172a" font-weight="600">52 queries</text>
<text x="140" y="224.0" font-size="12.5" fill="#64748b">each ranks every eligible trace</text>
<text x="140" y="243.0" font-size="12.5" fill="#64748b">and returns the next 100</text>
<path d="M229 150V172" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<rect x="64" y="304" width="350" height="58" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="80" y="330" font-size="17" fill="#334155" font-weight="700">486M rows read, 9.4 s</text>
<text x="80" y="349" font-size="12" fill="#64748b">pages x every eligible trace in retention</text>
<g filter="url(#sh)"><rect x="516" y="76" width="350" height="72" rx="16" fill="#fff" stroke="#e2e8f0"/></g>
<rect x="534" y="90.0" width="44" height="44" rx="12" fill="#f1f5f9"/><g fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="544" y="100.0" width="24" height="24" rx="4"/><path d="M550 108.0l4 4-4 4M557 116.0h6"/></g>
<text x="592" y="107.0" font-size="15.5" fill="#0f172a" font-weight="600">Worker</text>
<text x="592" y="128.0" font-size="12.5" fill="#64748b">sample(page_size=10000)</text>
<g filter="url(#glow)"><rect x="516" y="176" width="350" height="84" rx="16" fill="url(#chg)" stroke="#f59e0b" stroke-width="1.6"/></g>
<rect x="534" y="196.0" width="44" height="44" rx="12" fill="#fff" stroke="#fde68a"/><g transform="translate(544 206.0)"><path fill="#111827" d="M21.333 10H24v4h-2.667ZM16 1.335h2.667v21.33H16Zm-5.333 0h2.666v21.33h-2.666ZM0 22.665V1.335h2.667v21.33zm5.333-21.33H8v21.33H5.333Z"/></g>
<text x="592" y="203.0" font-size="15.5" fill="#0f172a" font-weight="600">1 query</text>
<text x="592" y="224.0" font-size="12.5" fill="#92400e">ranks every eligible trace once</text>
<text x="592" y="243.0" font-size="12.5" fill="#92400e">worker freezes it on the job</text>
<rect x="780.8" y="165" width="73.2" height="22" rx="11" fill="#f59e0b"/>
<text x="817.4" y="180" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" letter-spacing="0.8">ONE PASS</text>
<path d="M691 150V172" stroke="#d97706" stroke-width="2.4" fill="none" marker-end="url(#ara)"/>
<rect x="516" y="304" width="350" height="58" rx="12" fill="#fffbeb" stroke="#fde68a"/>
<text x="532" y="330" font-size="17" fill="#b45309" font-weight="700">1.0M rows read, 105 ms</text>
<text x="532" y="349" font-size="12" fill="#64748b">smaller page only if a response is too large</text>
</svg>
