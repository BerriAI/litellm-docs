<text x="458" y="107" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">-6</text>
<rect x="488" y="70" width="48" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="512" y="107" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">-5</text>
