<text x="674" y="107" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">-2</text>
<g filter="url(#glow)"><rect x="720" y="70" width="48" height="64" rx="10" fill="url(#chg)" stroke="#f59e0b" stroke-width="1.6"/></g>
<text x="744" y="107" font-size="12.5" fill="#92400e" font-weight="600" text-anchor="middle">-1</text>
