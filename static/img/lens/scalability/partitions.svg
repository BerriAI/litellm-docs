<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 310" role="img" aria-label="Partition pruning for a 24 hour sample: older partitions are skipped, the 7 day slack and the window are read" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<title>Partition pruning for a 24 hour sample: older partitions are skipped, the 7 day slack and the window are read</title>
<defs>
