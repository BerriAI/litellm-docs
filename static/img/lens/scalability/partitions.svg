<text x="512.0" y="176" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">7 day slack</text>
<text x="512.0" y="194" font-size="12" fill="#64748b" text-anchor="middle">early spans and late ingest</text>
