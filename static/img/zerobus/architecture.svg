<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-labelledby="title description">
  <title id="title">LiteLLM and Databricks Zerobus architecture</title>
  <desc id="description">An application calls a cloud-deployed LiteLLM Gateway using a virtual key. LiteLLM routes requests to the model provider and asynchronously sends buffered JSON logs to Zerobus Ingest, which writes to a Delta table governed by Unity Catalog.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="log-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#cf4a32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1078" height="578" rx="20" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Databricks destination -->
  <rect x="376" y="324" width="676" height="228" rx="18" fill="#fff8f5" stroke="#f1d7ce"/>
  <text x="400" y="354" fill="#99422f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">DATABRICKS</text>

  <!-- Request and log delivery paths -->
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M 304 136 H 398" stroke="#64748b" marker-end="url(#arrow)"/>
    <path d="M 664 136 H 758" stroke="#64748b" marker-end="url(#arrow)"/>
    <path d="M 532 224 V 382" stroke="#cf4a32" stroke-dasharray="6 7" marker-end="url(#log-arrow)"/>
    <path d="M 664 456 H 758" stroke="#cf4a32" marker-end="url(#log-arrow)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="14" fill="#475569">
    <text x="352" y="119">HTTPS</text>
    <text x="712" y="119">Model API</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="554" y="274" font-size="17" font-weight="600" fill="#9b3a28">Asynchronous request logs</text>
    <text x="554" y="299" font-size="15" fill="#64748b">Buffered JSON batches</text>
  </g>

  <!-- Application -->
  <rect x="40" y="48" width="264" height="176" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="144" y="70" width="56" height="56" rx="14" fill="#f1f5f9"/>
  <g transform="translate(152 79)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="2" width="38" height="32" rx="4"/>
    <path d="M 1 10 H 39 M 7 6 H 8 M 12 6 H 13 M 13 17 L 8 22 L 13 27 M 27 17 L 32 22 L 27 27 M 22 16 L 18 28"/>
  </g>
  <text x="172" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Application</text>
  <text x="172" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">Virtual key authentication</text>

  <!-- LiteLLM Gateway -->
  <rect x="400" y="48" width="264" height="176" rx="16" fill="#f5f9ff" stroke="#90b5eb" stroke-width="1.6"/>
  <rect x="504" y="70" width="56" height="56" rx="14" fill="#e1edff"/>
  <g transform="translate(512 79)" fill="none" stroke="#2861b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="13" width="11" height="12" rx="3"/>
    <rect x="28" y="1" width="11" height="12" rx="3"/>
    <rect x="28" y="25" width="11" height="12" rx="3"/>
    <path d="M 12 19 H 20 M 20 19 V 7 H 28 M 20 19 V 31 H 28"/>
    <circle cx="20" cy="19" r="2" fill="#2861b0"/>
  </g>
  <text x="532" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#0f172a">LiteLLM Gateway</text>
  <text x="532" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526580">Your cloud deployment</text>

  <!-- Model provider -->
  <rect x="760" y="48" width="264" height="176" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="864" y="70" width="56" height="56" rx="14" fill="#f1f5f9"/>
  <g transform="translate(873 79)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="7" width="24" height="24" rx="5"/>
    <path d="M 13 1 V 7 M 25 1 V 7 M 13 31 V 37 M 25 31 V 37 M 1 13 H 7 M 1 25 H 7 M 31 13 H 37 M 31 25 H 37 M 19 12 L 21 17 L 26 19 L 21 21 L 19 26 L 17 21 L 12 19 L 17 17 Z"/>
  </g>
  <text x="892" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Model provider</text>
  <text x="892" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">Your configured models</text>

  <!-- Zerobus Ingest -->
  <rect x="400" y="384" width="264" height="144" rx="16" fill="#ffffff" stroke="#e8b4a6" stroke-width="1.4"/>
  <rect x="418" y="404" width="44" height="44" rx="12" fill="#fff0e9"/>
  <g transform="translate(424 413)" fill="none" stroke="#cb4b32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 3 H 16 M 0 13 H 26 M 0 23 H 16 M 21 8 L 26 13 L 21 18 M 23 0 H 31 V 26 H 23"/>
  </g>
  <text x="418" y="482" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Zerobus Ingest</text>
  <text x="418" y="507" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">JSON over HTTPS</text>

  <!-- Unity Catalog Delta table -->
  <rect x="760" y="384" width="264" height="144" rx="16" fill="#ffffff" stroke="#e8b4a6" stroke-width="1.4"/>
  <rect x="778" y="404" width="44" height="44" rx="12" fill="#fff0e9"/>
  <g transform="translate(785 410)" fill="none" stroke="#cb4b32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="15" cy="6" rx="14" ry="5"/>
    <path d="M 1 6 V 26 C 1 32 29 32 29 26 V 6 M 1 16 C 1 22 29 22 29 16"/>
  </g>
  <text x="778" y="482" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Delta table</text>
  <text x="778" y="507" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">Governed by Unity Catalog</text>
</svg>
