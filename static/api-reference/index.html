<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LiteLLM Proxy API Reference</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/img/favicon.ico">
  <style>body { margin: 0; }</style>
</head>
<body>
  <div id="reference"></div>
  <script
    src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.81.0/dist/browser/standalone.js"
    integrity="sha384-DXupxC0wR1MllQMEexwTowkgKaBvZGJuwz+TU+7cHC09aC+q5vPMiJS2TW3GWjPN"
    crossorigin="anonymous"
  ></script>
  <script>
    const slug = value => encodeURIComponent(value).replaceAll('~', '%7E').replaceAll('%', '~');
    if (location.hash.startsWith('#/')) {
      try {
        const parts = location.hash.slice(2).split('/').map(decodeURIComponent);
        history.replaceState(null, '', '#tag/' + parts.map(slug).join('/'));
      } catch {
        history.replaceState(null, '', location.pathname + location.search);
      }
    }
    Scalar.createApiReference('#reference', {
      url: '/openapi.json',
      generateTagSlug: ({name}) => slug(name),
      generateOperationSlug: ({operationId, method, path}) => slug(operationId || method + path),
      hideTestRequestButton: true,
      hideClientButton: true,
      showDeveloperTools: 'never',
      withDefaultFonts: false,
      telemetry: false,
      agent: {disabled: true},
    });
  </script>
</body>
</html>
